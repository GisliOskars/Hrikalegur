name: Dagleg réttarvakt

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-legal-monitoring
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sækja vefinn
        uses: actions/checkout@v4

      - name: Setja upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Keyra gæðapróf
        run: npm test

      - name: Sækja ný UUA-mál
        run: npm run collect:uua

      - name: Sækja ný mál úr Samráðsgátt
        run: npm run collect:samrad
        env:
          SAMRAD_SOFT_FAIL: "1"

      - name: Sækja nýjar fréttir Stjórnarráðsins
        run: npm run collect:stjornarrad
        env:
          STJORNARRAD_SOFT_FAIL: "1"

      - name: Vista keyrsluskýrslu
        uses: actions/upload-artifact@v4
        with:
          name: uua-report-${{ github.run_number }}
          path: data/uua-report.json
          retention-days: 14

      - name: Vista skýrslu Samráðsgáttar
        uses: actions/upload-artifact@v4
        with:
          name: samrad-report-${{ github.run_number }}
          path: data/samrad-report.json
          retention-days: 14

      - name: Vista skýrslu Stjórnarráðsins
        uses: actions/upload-artifact@v4
        with:
          name: stjornarrad-report-${{ github.run_number }}
          path: data/stjornarrad-report.json
          retention-days: 14

      - name: Birta aðeins ef málaskrá breyttist
        run: |
          if git diff --quiet -- data/uua.json data/samrad.json data/stjornarrad.json; then
            echo "Engin ný eða breytt mál."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uua.json data/samrad.json data/stjornarrad.json
          git commit -m "Uppfæra daglega réttarvakt"
          git push
